<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Student Card</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">

    <!-- Student Card Container -->
    <!-- hover:shadow-xl makes the shadow stronger when the mouse moves over the card -->
    <div class="w-80 bg-white p-6 rounded-2xl shadow-md transition-shadow duration-300 hover:shadow-xl">
        
        <!-- Student Name Heading -->
        <h2 class="text-2xl font-bold text-center text-gray-800">Vidit jain</h2>
        
        <!-- Short Description -->
        <p class="mt-3 text-sm text-center text-gray-600 mb-6">
            A dedicated computer science student passionate about building modern, interactive web applications.
        </p>

        <!-- Button Container -->
        <div class="flex justify-center">
            <!-- View Profile Button -->
            <!-- hover:bg-blue-700 changes the background color when the mouse moves over the button -->
            <button class="bg-blue-500 text-white font-semibold py-2 px-6 rounded-lg transition-colors duration-300 hover:bg-blue-700">
                View Profile
            </button>
        </div>

    </div>

</body>
</html>
