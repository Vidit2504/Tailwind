<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Student Card</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">

    <!-- Student Card Container -->
    <div class="w-72 h-48 bg-blue-50 rounded-xl p-6 shadow-md">
        
        <!-- Centered Heading -->
        <h1 class="text-2xl font-bold text-center text-blue-900">Jane Doe</h1>
        
        <!-- Short Description -->
        <p class="mt-4 text-sm text-center text-blue-700">
            A dedicated computer science student passionate about building modern web applications.
        </p>

    </div>

</body>
</html>
